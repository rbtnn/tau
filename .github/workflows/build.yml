name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------------
  #  テスト: tau-cli (コンソール版) の単体テストを Linux / Windows で回す
  # ---------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/tests.csproj

      - name: Check formatting
        run: |
          dotnet format tau-cli.csproj --verify-no-changes --verbosity diagnostic
          dotnet format src/pdf2text/pdf2text.csproj --verify-no-changes
          dotnet format src/word2text/word2text.csproj --verify-no-changes
          dotnet format src/excel2text/excel2text.csproj --verify-no-changes

      - name: Test
        run: dotnet test tests/tests.csproj -c Release --no-restore
             --logger "trx;LogFileName=results.trx"
             --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  #  自己診断: ビルドした tau で --test=offline を実行する
  # ---------------------------------------------------------------------
  selftest:
    name: selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build tau-cli.csproj -c Release -o dist

      - name: Self test (offline)
        shell: bash
        run: |
          export TAU_TEST_NO_INPUT=1
          export TAU_AMBIGUOUS_WIDTH=1
          # 一時的な設定で API 呼び出しをスキップさせる
          tmp="${RUNNER_TEMP:-/tmp}/tau-selftest"
          rm -rf "$tmp"; mkdir -p "$tmp"
          export HOME="$tmp"
          export XDG_CONFIG_HOME="$tmp/.config"
          export APPDATA="$tmp"
          if [ -f dist/tau.exe ]; then
            ./dist/tau.exe --test=offline
          else
            dotnet dist/tau.dll --test=offline
          fi

  # ---------------------------------------------------------------------
  #  リリース: タグ push 時に Windows (x86 / x64) 向け単一ファイルを作る
  # ---------------------------------------------------------------------
  build:
    name: build (${{ matrix.rid }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
          - rid: win-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish tau-cli
        run: >
          dotnet publish tau-cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Publish helper tools
        run: |
          for tool in pdf2text word2text excel2text; do
            dotnet publish "src/$tool/$tool.csproj" \
              -c Release \
              -r ${{ matrix.rid }} \
              --self-contained \
              -p:PublishSingleFile=true \
              -o "publish/${{ matrix.rid }}"
          done

      - name: Package
        shell: bash
        run: |
          cd "publish/${{ matrix.rid }}"
          rm -f ./*.pdb
          zip -q "../../tau-${{ matrix.rid }}.zip" \
            tau.exe pdf2text.exe word2text.exe excel2text.exe

      - uses: actions/upload-artifact@v4
        with:
          name: tau-${{ matrix.rid }}
          path: tau-${{ matrix.rid }}.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------
  #  GitHub Release: タグ push 時のみ
  # ---------------------------------------------------------------------
  release:
    name: release
    needs: [build, selftest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
